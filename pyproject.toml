[project]
name = "fmcl"
version = "2.12.6"
description = "Fusion Minecraft Launcher - A feature-rich Minecraft launcher with multi-threaded download support, Forge installation, and GUI version selection"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10,<3.12"
dependencies = [
    "minecraft-forgepy>=1.0",
    "requests>=2.28.0",
    "logzero>=1.7.0",
    "tqdm>=4.64.0",
    "keyboard>=0.13.5",
    "customtkinter>=5.2.0",
    "orjson>=3.9.0",
    "aiohttp>=3.9.0",
    "cryptography>=47.0.0",
    "rarfile>=4.1",
    "pygame>=2.6.1",
    "mutagen>=1.47.0",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
    "markdown>=3.7",
    "tkinterweb>=4.25.2",
    "tomli>=2.0.0; python_version < '3.11'",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.610.43",
    "tkhtmlview>=0.3.2",
    "qrcode>=8.2",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "sentencepiece>=0.1.99",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "urllib3>=2.0.0",
    "pyautogui>=0.9.54",
    "pydub>=0.25.1",
    "scipy>=1.11.0",
    "pyperclip>=1.8.2",
    "pypinyin>=0.51.0",
    "tkinterdnd2>=0.4.0",
    "pillow>=10.0.0",
    "gpu-detector>=0.3.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "build>=1.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio",
]
ui = [
    "pyside6-addons==6.7.3",
    "pyside6-essentials==6.7.3",
]

[tool.uv]
# dev 与 ui 都算默认组：`uv sync` / `uv run` 不会把 PySide6 卸掉。
# 不这样设的后果很隐蔽 —— ui 是非默认组时，任何一次 `uv sync`（`uv run` 默认也会同步）
# 都会静默卸载 pyside6-essentials/addons/shiboken6，让 QML 侧的 POC 与打包突然失效。
# 代价：只跑旧 Tk 界面的开发机也会装上 Qt（约 460 MB）。这是有意的取舍：
# 迁移期两种界面并存，而"依赖悄悄消失"比"多占磁盘"危险得多。
default-groups = ["dev", "ui"]

[tool.black]
line-length = 120
target-version = ["py310", "py311"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
skip_gitignore = true
extend_skip_glob = ["tmp/*", "plugins/*", "api/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
