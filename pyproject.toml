[project]
name = "fmcl"
version = "3.0.0"
description = "Fusion Minecraft Launcher - A feature-rich Minecraft launcher with multi-threaded download support, Forge installation, and GUI version selection"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10,<3.12"
dependencies = [
    "minecraft-forgepy>=1.0",
    "requests>=2.28.0",
    "logzero>=1.7.0",
    "tqdm>=4.64.0",
    "keyboard>=0.13.5",
    "orjson>=3.9.0",
    "aiohttp>=3.9.0",
    "cryptography>=47.0.0",
    "rarfile>=4.1",
    "mutagen>=1.47.0",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
    "markdown>=3.7",
    "tomli>=2.0.0; python_version < '3.11'",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.610.43",
    "qrcode>=8.2",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "sentencepiece>=0.1.99",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "urllib3>=2.0.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "pypinyin>=0.51.0",
    "pillow>=10.0.0",
    "gpu-detector>=0.3.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "build>=1.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio",
    #: 并行跑测试：全量 370s → 125s。
    #: **必须写进依赖声明**：不写的话下一次 `uv sync` 会把它卸掉，
    #: 而 `addopts` 里的 `-n 8` 会让 pytest 直接报"unrecognized arguments"。
    "pytest-xdist>=3.8.0",
]
ui = [
    "pyside6-addons==6.7.3",
    "pyside6-essentials==6.7.3",
]

[tool.uv]
# dev 与 ui 都算默认组：`uv sync` / `uv run` 不会把 PySide6 卸掉。
# 不这样设的后果很隐蔽 —— ui 是非默认组时，任何一次 `uv sync`（`uv run` 默认也会同步）
# 都会静默卸载 pyside6-essentials/addons/shiboken6，让 QML 侧功能与打包突然失效。
# 代价是即使不开发界面也会安装 Qt（约 460 MB）；相比依赖被悄悄卸载，这个代价更可控。
default-groups = ["dev", "ui"]

[tool.black]
line-length = 120
target-version = ["py310", "py311"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
skip_gitignore = true
extend_skip_glob = ["tmp/*", "plugins/*", "api/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -n 8 --dist loadfile"
pythonpath = ["."]
#: 并行加速（pytest-xdist）：全量从 ~370s 降到 ~142s。
#: **为什么是 8 而不是 `auto`**：worker 数接近核数时，几个时序断言会因资源竞争偶发失败
#: （`test_ui_port_qt` 与安装向导探针曾各失败一次）；8 个 worker 连跑稳定。
#: 核数更多的机器也不要盲目开满。
#: **为什么是 `--dist loadfile`**：本仓库有大量"模块级 fixture 装配真引擎 / 真应用"的测试
#: （`test_main_qml_entry`、各 QML 探针、视觉回归），按**文件**分给同一个 worker 才不会
#: 互相踩（默认的 `load` 会把同一文件的用例拆到不同进程，模块级 fixture 就废了）。
#: 并行还会暴露两类"测试污染"，已用隔离 fixture 处理：
#:   * 单实例守卫 → `tests/single_instance_isolation.py`（否则后到的 worker 抛 AlreadyRunning）；
#:   * 真配置写盘 → `tests/config_isolation.py` + `tests/conftest.py`（否则跑一轮测试就把
#:     本地 `config.json` 改了 —— 语言与强调色都曾受影响）。
#: 串行跑（排查并行偶发红 / 看真实顺序）：`pytest -n0`。
#: 自定义标记要登记，否则 pytest 会打 PytestUnknownMarkWarning（实测出现过）。
#: `slow` = 起子进程 + 遍历页面的重度测试（UI 冒烟测试），
#: 用 `-m "not slow"` 可以整体跳过、只跑快测。
markers = [
    "slow: 重度测试（起子进程/遍历页面/多平台抓帧），可用 -m \"not slow\" 跳过",
]
