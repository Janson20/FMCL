[project]
name = "fmcl"
version = "2.12.6"
description = "Fusion Minecraft Launcher - A feature-rich Minecraft launcher with multi-threaded download support, Forge installation, and GUI version selection"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10,<3.12"
dependencies = [
    "minecraft-forgepy>=1.0",
    "requests>=2.28.0",
    "logzero>=1.7.0",
    "tqdm>=4.64.0",
    "keyboard>=0.13.5",
    "customtkinter>=5.2.0",
    "orjson>=3.9.0",
    "aiohttp>=3.9.0",
    "cryptography>=47.0.0",
    "rarfile>=4.1",
    "pygame>=2.6.1",
    "mutagen>=1.47.0",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
    "markdown>=3.7",
    "tkinterweb>=4.25.2",
    "tomli>=2.0.0; python_version < '3.11'",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.610.43",
    "tkhtmlview>=0.3.2",
    "qrcode>=8.2",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "sentencepiece>=0.1.99",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "urllib3>=2.0.0",
    "pyautogui>=0.9.54",
    # ↓ 音效链（EQ / 混响 / 变调 / 变速）的外部依赖说明，见 D-147：
    # pydub 只是 Python 侧的容器，真正解码/编码音频的是**外部 ffmpeg 可执行文件**。
    # 它不是 PyPI 包（本项目不引入打包二进制的第三方包，也不随附来源不明的二进制），
    # 所以**无法**在这里写成依赖项 —— 它属于运行期的可选外部依赖：没装时启动器照常
    # 工作，只是音效处理整体降级为播原文件。探测方式是 `shutil.which("ffmpeg")`，
    # 见 services/music_effects.py 的 `FFMPEG_PATH` / `ffmpeg_available()`；
    # 探测失败时该模块会打一条可定位的 WARNING（不再静默）。用户侧说明见 README「环境要求」。
    "pydub>=0.25.1",
    "scipy>=1.11.0",
    "pyperclip>=1.8.2",
    "pypinyin>=0.51.0",
    "tkinterdnd2>=0.4.0",
    "pillow>=10.0.0",
    "gpu-detector>=0.3.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "build>=1.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio",
    #: 并行跑测试（2026-10-06 用户要求"pytest 太慢了"）：全量 370s → 125s。
    #: **必须写进依赖声明**：不写的话下一次 `uv sync` 会把它卸掉，
    #: 而 `addopts` 里的 `-n 8` 会让 pytest 直接报"unrecognized arguments"。
    "pytest-xdist>=3.8.0",
]
ui = [
    "pyside6-addons==6.7.3",
    "pyside6-essentials==6.7.3",
]

[tool.uv]
# dev 与 ui 都算默认组：`uv sync` / `uv run` 不会把 PySide6 卸掉。
# 不这样设的后果很隐蔽 —— ui 是非默认组时，任何一次 `uv sync`（`uv run` 默认也会同步）
# 都会静默卸载 pyside6-essentials/addons/shiboken6，让 QML 侧的 POC 与打包突然失效。
# 代价：只跑旧 Tk 界面的开发机也会装上 Qt（约 460 MB）。这是有意的取舍：
# 迁移期两种界面并存，而"依赖悄悄消失"比"多占磁盘"危险得多。
default-groups = ["dev", "ui"]

[tool.black]
line-length = 120
target-version = ["py310", "py311"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
skip_gitignore = true
extend_skip_glob = ["tmp/*", "plugins/*", "api/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -n 8 --dist loadfile"
pythonpath = ["."]
#: 并行加速（pytest-xdist，2026-10-06 用户要求）：全量从 ~370s 降到 ~142s。
#: **为什么是 8 而不是 `auto`**：本机 16 核，`-n auto` 起 16 个 worker = "16 个 worker 抢
#: 16 个核"，几个时序断言会被饿红（实测 `test_ui_port_qt` 与安装向导探针各红过一次）；
#: 8 个 worker 连跑两轮全绿（142s / 150s），比 auto 只慢十几秒。机器更好也别盲目开满。
#: **为什么是 `--dist loadfile`**：本仓库有大量"模块级 fixture 装配真引擎 / 真应用"的测试
#: （`test_main_qml_entry`、各 QML 探针、视觉回归），按**文件**分给同一个 worker 才不会
#: 互相踩（默认的 `load` 会把同一文件的用例拆到不同进程，模块级 fixture 就废了）。
#: 并行还会暴露两类"测试污染"，都已修（见 `docs/refactor/16` §16.2）：
#:   * 单实例守卫 → `tests/single_instance_isolation.py`（否则后到的 worker 抛 AlreadyRunning）；
#:   * 真配置写盘 → `tests/config_isolation.py` + `tests/conftest.py`（否则跑一轮测试就把
#:     开发机的 `config.json` 改了 —— 语言与强调色都中过招）。
#: 串行跑（排查并行偶发红 / 看真实顺序）：`pytest -n0`。
#: 自定义标记要登记，否则 pytest 会打 PytestUnknownMarkWarning（实测出现过）。
#: `slow` = 起子进程 + 遍历页面的重度测试（2.19 的冒烟测试那一组），
#: 用 `-m "not slow"` 可以整体跳过、只跑快测。
markers = [
    "slow: 重度测试（起子进程/遍历页面/多平台抓帧），可用 -m \"not slow\" 跳过",
]
