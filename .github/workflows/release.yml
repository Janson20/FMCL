name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '测试构建版本号（留空则读取 pyproject.toml）'
        required: false
        type: string
      build_linux:
        description: '同时构建 Linux x86_64 产物'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          if (-not $v) {
            $m = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"'
            if ($m) { $v = $m.Matches[0].Groups[1].Value }
          }
          if (-not $v) { throw "无法确定版本号" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-windows.txt
          pip install pyinstaller "pyside6==6.7.3"
        shell: pwsh

      - name: Generate build-time secrets
        run: |
          echo "# Auto-generated at build time" > _build_secrets.py
          echo "BUILD_CURSEFORGE_API_KEY = '''${{ secrets.CURSEFORGE_API_KEY }}'''" >> _build_secrets.py
          echo "BUILD_MICROSOFT_CLIENT_ID = '''${{ secrets.MICROSOFT_CLIENT_ID }}'''" >> _build_secrets.py
        shell: bash

      - name: Fetch pinned third-party sources
        run: powershell -NoProfile -ExecutionPolicy Bypass -File third_party/fetch_sources.ps1
        shell: pwsh

      - name: Install Qt 6.7.3 SDK
        run: |
          pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 -m qt5compat qtshadertools -O C:\Qt
          "QTDIR=C:\Qt\6.7.3\msvc2019_64" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Resolve Visual Studio generator
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere.exe" }
          $ver = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion).Trim()
          if (-not $ver) { throw "找不到带 C++ 工具的 Visual Studio" }
          $major = ($ver -split '\.')[0]
          switch ($major) {
            '17' { $gen = 'Visual Studio 17 2022' }
            '18' { $gen = 'Visual Studio 18 2026' }
            default { throw "未识别的 Visual Studio 主版本: $ver" }
          }
          "generator=$gen" >> $env:GITHUB_OUTPUT
          Write-Host "MSVC generator: $gen (VS $ver)"

      - name: Build FluentUI QML plugin
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_fluentui.ps1 -QtDir $env:QTDIR -Generator "${{ steps.msvc.outputs.generator }}"
        shell: pwsh

      - name: Build QML onedir
        run: pyinstaller build.spec --noconfirm
        env:
          PLATFORM: win
          ARCH: amd64

      - name: Verify QML payload
        run: |
          if (-not (Test-Path 'dist\FMCL\FMCL.exe')) { throw '缺少 dist/FMCL/FMCL.exe' }
          if (-not (Test-Path 'dist\FMCL\_internal\qml\FluentUI\qmldir')) { throw '缺少 FluentUI QML 模块' }
          if (-not (Test-Path 'dist\FMCL\_internal\qml\FluentUI\fluentuiplugin.dll')) { throw '缺少 FluentUI QML 插件 DLL' }
          if (-not (Test-Path 'dist\FMCL\_internal\app_qml\App.qml')) { throw '缺少 app_qml/App.qml' }
        shell: pwsh

      - name: Install NSIS
        run: choco install nsis -y

      - name: Download 7-Zip installer
        run: |
          New-Item -ItemType Directory -Force -Path 7z_installers | Out-Null
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2602-x64.exe" -OutFile "7z_installers\7z2602-x64.exe" -TimeoutSec 120
        shell: pwsh

      - name: Download .NET 10 SDK installer
        run: |
          $meta = Invoke-RestMethod -Uri "https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/10.0/releases.json" -TimeoutSec 60
          $sdk = $meta.'latest-sdk'
          if (-not $sdk -or $sdk -notmatch '^10\.') { throw "无法获取 .NET SDK 版本: $sdk" }
          New-Item -ItemType Directory -Force -Path dotnet_sdk | Out-Null
          $url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/$sdk/dotnet-sdk-$sdk-win-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile "dotnet_sdk\dotnet-sdk-win-x64.exe" -TimeoutSec 300
        shell: pwsh

      - name: Build Windows installers
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = "C:\Program Files\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { throw "找不到 makensis" }
          $v = "${{ steps.version.outputs.version }}"
          & $nsis /INPUTCHARSET UTF8 /V3 "/DVERSION=$v" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "完整安装包构建失败" }
          & $nsis /INPUTCHARSET UTF8 /V3 "/DVERSION=$v" /DNO_DOTNET_SDK installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "精简安装包构建失败" }
          Get-ChildItem FMCL-Setup-*.exe | Select-Object Name, Length
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FMCL-windows
          path: FMCL-Setup-*.exe
          retention-days: 7

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_linux != 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' pyproject.toml | head -n 1)"
          fi
          if [ -z "$VERSION" ]; then
            echo "无法确定版本号" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libfontconfig1 libdbus-1-3 libportaudio2 libcups2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-unix.txt
          pip install pyinstaller "pyside6==6.7.3"

      - name: Fetch pinned third-party sources
        run: bash scripts/fetch_sources_linux.sh

      - name: Install Qt 6.7.3 SDK
        run: |
          pip install aqtinstall==3.3.0
          if ! python -m aqt install-qt linux desktop 6.7.3 gcc_64 -m qt5compat qtshadertools -O "$HOME/Qt"; then
            python -m aqt install-qt linux desktop 6.7.3 linux_gcc_64 -m qt5compat qtshadertools -O "$HOME/Qt"
          fi
          for candidate in "$HOME/Qt/6.7.3/gcc_64" "$HOME/Qt/6.7.3/linux_gcc_64"; do
            if [ -f "$candidate/lib/cmake/Qt6/Qt6Config.cmake" ]; then
              echo "QTDIR=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "找不到 Qt 6.7.3 SDK" >&2
          exit 1

      - name: Build FluentUI QML plugin
        run: bash scripts/build_fluentui_linux.sh --qt-dir "$QTDIR"

      - name: Build QML onedir
        run: pyinstaller build.spec --noconfirm
        env:
          PLATFORM: linux
          ARCH: amd64

      - name: Verify QML payload
        run: |
          test -x dist/FMCL/FMCL
          test -f dist/FMCL/_internal/qml/FluentUI/qmldir
          test -f dist/FMCL/_internal/qml/FluentUI/libfluentuiplugin.so || test -f dist/FMCL/_internal/qml/FluentUI/fluentuiplugin.so
          test -f dist/FMCL/_internal/app_qml/App.qml

      - name: Package Linux tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -C dist -czf "FMCL-${VERSION}-linux-x86_64.tar.gz" FMCL
          sha256sum "FMCL-${VERSION}-linux-x86_64.tar.gz" > SHA256SUMS

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FMCL-linux
          path: |
            FMCL-*-linux-x86_64.tar.gz
            SHA256SUMS
          retention-days: 7

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -maxdepth 1 -type f \( -name "*.exe" -o -name "*.tar.gz" \) -exec cp {} release_files/ \;
          cd release_files
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
